<script>

function pending(){return shifts.filter(s=>s.status==='pending')}
function myShifts(){return shifts.filter(s=>s.employee==='e1')}
function toast(t){state.toast=t;let n=document.querySelector('.toast');if(n)n.remove();n=document.createElement('div');n.className='toast';n.textContent=t;document.body.appendChild(n);setTimeout(()=>n.remove(),2900)}
function nav(id,label,icon,badge=''){return `<button type="button" class="nav ${state.page===id?'active':''}" data-page="${id}">${ico(icon)}<span>${label}</span>${badge?`<b class="nav-count">${badge}</b>`:''}</button>`}
function sidebar(){const mgr=state.role==='manager';return `<aside class="side"><div class="brand"><div class="brand-logo">Т</div><span class="brand-name">Такт</span></div><div class="nav-label">МЕНЮ</div><div class="nav-list">${nav('dashboard','Обзор','home')}${nav('schedule','Расписание','calendar')}${nav('employees',mgr?'Сотрудники':'Мои заявки',mgr?'users':'clock',mgr&&pending().length?pending().length:'')}${nav('coverage',mgr?'Потребность':'Свободные часы','bars')}${nav('reports','Отчёты','clock')}</div><div class="nav-label" style="margin-top:24px">ЛИЧНОЕ</div><div class="nav-list">${nav('profile','Личный кабинет','user')}${nav('settings','Настройки','settings')}<button class="nav" data-action="logout">${ico('exit')}<span>Выйти</span></button></div><div class="side-fill"></div><button class="side-profile" data-page="profile">${mgr?'<div class="avatar a0">Р</div>':avatar(people[0])}<div><strong>${mgr?'Руководитель точки':people[0].name}</strong><small>Мой профиль →</small></div></button></aside>`}
function header(){let mgr=state.role==='manager';return `<header class="top"><div class="search">${ico('search')}<input aria-label="Поиск" id="global-search" placeholder="Поиск сотрудника..." value="${state.query.replaceAll('"','&quot;')}"><span class="key">⌘ K</span></div><div class="top-actions"><span class="role-tag">Демо</span><button class="circle" data-action="notify" title="Уведомления">${ico('bell')}${pending().length&&mgr?'<i class="dot"></i>':''}</button><div class="top-user">${mgr?'<div class="avatar a0">Р</div>':avatar(people[0])}<div><small>Просмотр кабинета</small><select id="roleSwitch" aria-label="Выбрать роль"><option value="manager" ${mgr?'selected':''}>Руководитель</option><option value="employee" ${!mgr?'selected':''}>Сотрудник</option></select></div></div></div></header>`}
function pageHead(title,sub,actions=''){return `<div class="page-head"><div><h1 class="title">${title}</h1><div class="sub">${sub}</div></div><div class="head-actions">${actions}</div></div>`}
function dateControls(){return `<div class="date-pill"><button data-action="prev-week" aria-label="Предыдущая неделя">‹</button>${ico('calendar')}<span>${rangeLabel()}</span><button data-action="next-week" aria-label="Следующая неделя">›</button></div>`}
const palettes=[['#edf9f7','#007e7b','#039f91'],['#fff9e9','#b78b21','#e3b82f'],['#eef0ff','#4f59ad','#6c6fe1'],['#fff1ef','#c55348','#ef6b62'],['#eaf6f9','#176d87','#2895b1']];
function shiftCard(s){let idx=ix(s.employee),[bg,ink,line]=palettes[(idx+7)%5];return `<button class="shift" style="--bg:${bg};--ink:${ink};--line:${line}" data-shift="${s.id}"><strong>${s.start} – ${s.end}</strong><span>${person(s.employee)?.job||'Смена'}</span><small>30 мин перерыв</small></button>`}
function schedule(){let ds=dates(),isMgr=state.role==='manager',list=isMgr?people:[people[0]];let q=state.query.trim().toLocaleLowerCase('ru-RU');if(q)list=list.filter(p=>p.name.toLocaleLowerCase('ru-RU').includes(q)||p.job.toLocaleLowerCase('ru-RU').includes(q));return pageHead('Расписание',isMgr?'Недельные смены команды и распределение сотрудников':'Ваш график и подтверждённые смены',`${dateControls()}<button class="square-btn" data-action="filter" title="Фильтр">${ico('filter')}</button><button class="square-btn plus" data-action="new-shift" title="Добавить смену">+</button>`) + (state.filter==='all'?'':`<div class="alert">Показаны только смены на ${state.filter==='weekday'?'будние дни':'выходные'}. <button data-action="filter" class="secondary">Сбросить</button></div>`)+`<div class="schedule-wrap"><div class="schedule"><div class="sch-head first">Сотрудник</div>${ds.map((d,i)=>`<div class="sch-head">${names[i]} <small>${pad(d.getDate())}</small></div>`).join('')}${list.map(p=>`<div class="person">${avatar(p)}<div><strong>${p.name}</strong><small>${p.job}</small></div></div>${ds.map((d,i)=>{let s=shifts.filter(s=>s.employee===p.id&&s.date===key(d)&&s.status==='approved');return `<div class="cell">${!(state.filter==='weekday'&&i>4||state.filter==='weekend'&&i<5)?s.map(shiftCard).join(''):''}</div>`}).join('')}`).join('')}</div>${!list.length?'<div class="empty-schedule">Сотрудники не найдены</div>':''}</div><div class="foot-note">Цветные карточки — подтверждённые смены · Заявки ожидают одобрения руководителя · Нажмите на смену, чтобы посмотреть детали.</div>`}
function metric(label,num,hint){return `<div class="metric"><div class="lbl">${label}</div><div class="num">${num}</div><div class="hint">${hint}</div></div>`}
function lineChart(){const values=[2,3,3,4,6,5,6,7,6,5,4,6,7,5];let pts=values.map((v,i)=>[34+i*37,170-v*19]),points=pts.map(p=>p.join(',')).join(' ');return `<svg viewBox="0 0 550 220" class="chart" role="img" aria-label="Загруженность по часам">${[40,85,130,175].map(y=>`<line class="chart-grid" x1="30" x2="540" y1="${y}" y2="${y}"/>`).join('')}<polygon class="chart-area" points="34,190 ${points} 515,190"/><polyline class="chart-path" points="${points}"/>${pts.filter((_,i)=>i%3===0).map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#fff" stroke="#188f8a" stroke-width="2"/>`).join('')}${['08:00','11:00','14:00','17:00','20:00','23:00'].map((t,i)=>`<text x="${24+i*98}" y="212">${t}</text>`).join('')}</svg>`}
function dashboard(){const mgr=state.role==='manager';let today=key(new Date()),todayS=shifts.filter(s=>s.date===today&&s.status==='approved');if(!mgr)return pageHead('Мой день','Личная панель сотрудника',`<button class="primary" data-action="new-shift">+ Запросить смену</button>`)+profileContents(false);return pageHead('Обзор','Контроль смен и загруженности точки',`<button class="primary" data-action="new-shift">+ Добавить смену</button>`)+`<div class="user-hero"><div class="avatar lg a0">Р</div><div><h2>Добрый день, руководитель!</h2><p>Расписание, заявки и потребность в сотрудниках — в одном месте</p></div><div class="hero-right"><span class="badge">● Система активна</span><div class="muted" style="margin-top:9px">${longDate(new Date())}</div></div></div><div class="cards">${metric('Всего сотрудников','7','Активны в системе')}${metric('Смен на неделе',shifts.filter(s=>s.status==='approved'&&dates().some(d=>key(d)===s.date)).length,'Подтверждено')}${metric('Заявки на смены',pending().length,'Ожидают решения')}${metric('Сегодня в сменах',todayS.length,'По графику')}</div><div class="row2"><section class="panel"><h3>Активность сотрудников по часам</h3><div class="muted">Иллюстративная динамика нагрузки</div>${lineChart()}</section><section class="panel"><h3>Требуемое покрытие сегодня</h3>${[9,12,15,18,21].map(h=>{let c=coverage(today,h),n=need(today,h);return `<div class="bar-row"><span>${pad(h)}:00</span><div class="bar"><em class="${c<n?'low':''}" style="width:${Math.min(100,c/Math.max(1,n)*100)}%"></em></div><b class="${c<n?'warn':'good'}">${c}/${n}</b></div>`}).join('')}<button class="secondary" data-page="coverage" style="margin-top:11px">Настроить потребность →</button></section></div>`}
function profileContents(mgr){let p=people[0],mine=myShifts().filter(s=>s.status==='approved'),week=dates(),total=mine.filter(s=>week.some(d=>key(d)===s.date)).reduce((a,s)=>a+hours(s),0);return `<div class="user-hero">${mgr?'<div class="avatar lg a0">Р</div>':avatar(p,true)}<div><h2>${mgr?'Кабинет руководителя':p.name}</h2><p>${mgr?'Управление точкой · Права руководителя':p.job+' · Личный график и учёт часов'}</p></div><div class="hero-right"><span class="badge">● Активный профиль</span></div></div><div class="cards">${mgr?metric('Сотрудники','7','В команде'):metric('Часы на неделе',total.toFixed(1).replace('.',',')+' ч','По подтверждённым сменам')}${mgr?metric('Смены',shifts.filter(s=>s.status==='approved').length,'По графику'):metric('Подтверждённые смены',mine.length,'В личном графике')}${metric('Ожидающие заявки',mgr?pending().length:myShifts().filter(s=>s.status==='pending').length,'Нужно решение')}${metric(mgr?'График':'Статус',mgr?'7 дней':'Активен',mgr?'Планирование по дням':'Личный кабинет')}</div><div class="row2"><div class="panel"><h3>${mgr?'Расписание команды':'Мои смены на этой неделе'}</h3><div class="mini-week">${week.map((d,i)=>{let booked=shifts.some(s=>s.date===key(d)&&s.status==='approved'&&(mgr||s.employee===p.id));return `<div class="mini-day ${booked?'booked':''}"><small>${names[i]}</small><strong>${d.getDate()}</strong><small>${booked?'● Смена':'—'}</small></div>`}).join('')}</div><button class="secondary" data-page="schedule" style="margin-top:18px">Открыть расписание →</button></div><div class="panel">${mgr?'<h3>Быстрые действия</h3><p>Изменяйте норматив сотрудников для каждого часа, утверждайте заявки и следите за покрытием.</p><button class="primary" data-page="coverage">Задать потребность</button><button class="secondary" style="margin:9px 0 0 8px" data-page="employees">Заявки</button>':`<h3>Учёт посещаемости</h3><p>${state.clockIn?'Вы на смене с '+state.clockIn+'.':'Пришли на работу? Отметьте начало смены.'} Минимальная продолжительность — 5 часов.</p><button class="${state.clockIn?'secondary':'primary'}" data-action="clock">${state.clockIn?'Завершить смену':'Отметить приход'}</button>${state.clockOut?`<p class="muted">Последний уход: ${state.clockOut}</p>`:''}<div style="margin-top:17px"><button class="secondary" data-action="new-shift">+ Запросить смену</button></div>`}</div></div>`}
function profile(){return pageHead(state.role==='manager'?'Личный кабинет руководителя':'Мой кабинет','Персональная информация, график и быстрые действия')+profileContents(state.role==='manager')}
function employees(){if(state.role!=='manager'){let list=myShifts().slice().sort((a,b)=>a.date.localeCompare(b.date));return pageHead('Мои заявки','История подтверждений и предстоящих смен',`<button class="primary" data-action="new-shift">+ Запросить смену</button>`)+`<div class="panel"><h3>Мои смены и заявки</h3>${list.map(s=>`<div class="request"><div class="info"><strong>${new Date(s.date+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})} · ${s.start}–${s.end}</strong><small>${hours(s)} ч · ${s.status==='pending'?'Ожидает подтверждения':s.status==='approved'?'Подтверждено':'Отклонено'}</small></div>${s.status==='pending'?`<button class="secondary" data-action="cancel" data-id="${s.id}">Отозвать</button>`:`<span class="badge">${s.status==='approved'?'✓ Принята':'Отклонена'}</span>`}</div>`).join('')||'<div class="empty-box">Заявок пока нет</div>'}</div>`}
return pageHead('Сотрудники','Команда точки, роли и входящие запросы',`<button class="primary" data-action="new-shift">+ Назначить смену</button>`)+`<div class="panel" style="margin-bottom:19px"><h3>Ожидают подтверждения <span class="chip">${pending().length}</span></h3>${pending().map(s=>`<div class="request">${avatar(person(s.employee))}<div class="info"><strong>${person(s.employee).name}</strong><small>${new Date(s.date+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})} · ${s.start} – ${s.end} · ${hours(s)} ч</small></div><button class="secondary" data-action="reject" data-id="${s.id}">Отклонить</button><button class="primary" data-action="approve" data-id="${s.id}">Одобрить</button></div>`).join('')||'<div class="muted">Все заявки рассмотрены</div>'}</div><h3 class="section-title">Команда · ${people.length} сотрудников</h3><div class="emp-list">${people.map(p=>`<div class="emp-item">${avatar(p)}<div><strong>${p.name}</strong><small>${p.job}</small></div><button class="secondary" data-action="emp-details" data-id="${p.id}">Подробнее</button></div>`).join('')}</div>`}
function coveragePage(){const mgr=state.role==='manager';let date=state.demandDate;let rows=Array.from({length:16},(_,i)=>8+i);return pageHead(mgr?'Потребность в персонале':'Свободные часы',mgr?'Задайте, сколько сотрудников необходимо в каждый час':'Смотрите, в какое время команде нужна помощь',`<button class="secondary" data-page="schedule">Открыть расписание →</button>`)+`<div class="panel" style="margin-bottom:18px"><div class="need-head"><label class="field">День<input type="date" id="demandDate" value="${date}"></label><div class="muted">${mgr?'Изменения сразу отображаются в расчёте покрытия.':'Оранжевым отмечены часы с нехваткой сотрудников.'}</div></div><div class="coverage"><div class="ch"><span>Время</span><span>В графике</span><span>Необходимо</span><span>Результат</span></div>${rows.map(h=>{let n=need(date,h),c=coverage(date,h),diff=c-n;return `<div class="cr"><span><strong>${pad(h)}:00</strong></span><span>${c} чел.</span><span>${mgr?`<div class="stepper"><button data-action="need-down" data-hour="${h}">−</button><b>${n}</b><button data-action="need-up" data-hour="${h}">+</button></div>`:n+' чел.'}</span><span class="${diff>=0?'good':'warn'}">${diff<0?'Не хватает '+(-diff):diff===0?'Укомплектовано':'Резерв +'+diff}</span></div>`}).join('')}</div></div>${!mgr?'<button class="primary" data-action="new-shift">Запросить смену в удобное время</button>':''}`}
function reports(){const isMgr=state.role==='manager';let selected=isMgr?shifts.filter(s=>s.status==='approved'):myShifts().filter(s=>s.status==='approved');let allHours=selected.reduce((a,s)=>a+hours(s),0),weekSet=dates().map(key);let thisWeek=selected.filter(s=>weekSet.includes(s.date));return pageHead('Отчёты',isMgr?'Основные показатели по текущему расписанию':'Учёт личных часов',`<button class="secondary" data-page="schedule">К расписанию</button>`)+`<div class="cards">${metric('Подтверждённые смены',selected.length,'За весь период')}${metric('Запланировано часов',Math.round(allHours)+' ч','Без учёта перерывов')}${metric('Смены на неделе',thisWeek.length,'В выбранной неделе')}${metric('Заявки',isMgr?pending().length:myShifts().filter(s=>s.status==='pending').length,'Ожидают подтверждения')}</div><section class="panel"><h3>${isMgr?'Нагрузка по сотрудникам':'Часы по дням недели'}</h3>${(isMgr?people:dates()).map((a,i)=>{let label=isMgr?a.name:`${names[i]} ${fmt(a)}`,s=isMgr?selected.filter(s=>s.employee===a.id):selected.filter(s=>s.date===key(a)),n=s.reduce((v,s)=>v+hours(s),0);return `<div class="bar-row" style="grid-template-columns:${isMgr?'130px':'75px'} 1fr 46px"><span>${label}</span><div class="bar"><em style="width:${Math.min(100,n/(isMgr?35:10)*100)}%"></em></div><b>${n.toFixed(1)} ч</b></div>`}).join('')}</section>`}
function settings(){return pageHead('Настройки','Параметры интерфейса и аккаунта')+`<div class="panel" style="max-width:620px"><h3>Профиль и доступ</h3><div class="formgrid"><label class="field full">Точка обслуживания<input value="Такт · Демонстрационная точка" disabled></label><label class="field">Роль<select id="roleInSettings"><option value="manager" ${state.role==='manager'?'selected':''}>Руководитель</option><option value="employee" ${state.role==='employee'?'selected':''}>Сотрудник</option></select></label><label class="field">Язык интерфейса<select><option>Русский</option></select></label></div><p style="margin-top:18px">Это интерактивный дизайн-прототип. Полноценная авторизация, сохранение данных в базе и QR-фиксация посещения требуют подключения к серверу.</p></div>`}
function modal(){if(!state.modal)return '';let mgr=state.role==='manager';if(state.modal==='shift-detail'){const s=shifts.find(s=>s.id===state.selectedShift);if(!s)return '';return `<div class="modal-scrim" data-action="close-bg"><div class="modal"><div class="modal-top"><h3>Информация о смене</h3><button class="x" data-action="close">×</button></div><div class="user-hero" style="padding:15px">${avatar(person(s.employee))}<div><h2 style="font-size:15px">${person(s.employee).name}</h2><p>${person(s.employee).job}</p></div></div><p><strong>Дата:</strong> ${longDate(new Date(s.date+'T12:00:00'))}</p><p><strong>Время:</strong> ${s.start}–${s.end} (${hours(s)} ч)</p><p><strong>Статус:</strong> ${s.status==='approved'?'Подтверждена':'Ожидает решения'}</p><div class="modal-actions">${mgr?`<button class="secondary" data-action="delete-shift" data-id="${s.id}">Удалить смену</button>`:''}<button class="primary" data-action="close">Готово</button></div></div></div>`}
if(state.modal==='notify')return `<div class="modal-scrim" data-action="close-bg"><div class="modal"><div class="modal-top"><h3>Уведомления</h3><button class="x" data-action="close">×</button></div><p>${mgr?`Новых запросов: ${pending().length}.`:'Новые смены и ответы на заявки появятся здесь.'}</p><button class="primary" data-page="employees">${mgr?'Просмотреть заявки':'Мои заявки'}</button></div></div>`;
if(state.modal==='emp-detail'){const p=person(state.selectedShift),list=shifts.filter(s=>s.employee===p.id&&s.status==='approved');return `<div class="modal-scrim" data-action="close-bg"><div class="modal"><div class="modal-top"><h3>Карточка сотрудника</h3><button class="x" data-action="close">×</button></div><div class="user-hero">${avatar(p,true)}<div><h2 style="font-size:17px">${p.name}</h2><p>${p.job}</p></div></div><div class="cards" style="grid-template-columns:1fr 1fr">${metric('Смены',list.length,'Подтверждены')}${metric('Часы',list.reduce((a,s)=>a+hours(s),0)+' ч','По графику')}</div><button class="secondary" data-action="close">Закрыть</button></div></div>`}
return `<div class="modal-scrim" data-action="close-bg"><div class="modal"><div class="modal-top"><h3>${mgr?'Добавить смену':'Запросить смену'}</h3><button class="x" data-action="close">×</button></div><p class="muted">${mgr?'Назначьте сотрудника на выбранные часы.':'Выберите удобное время. Минимальная смена — 5 часов.'}</p><form id="shiftForm"><div class="formgrid">${mgr?`<label class="field full">Сотрудник<select name="employee">${people.map(p=>`<option value="${p.id}">${p.name} · ${p.job}</option>`).join('')}</select></label>`:''}<label class="field full">Дата<input name="date" type="date" value="${key(new Date())}" required></label><label class="field">Начало<input name="start" type="time" value="09:00" required></label><label class="field">Конец<input name="end" type="time" value="15:00" required></label></div>${state.modalError?`<div class="error">${state.modalError}</div>`:''}<div class="modal-actions"><button type="button" class="secondary" data-action="close">Отмена</button><button class="primary" type="submit">${mgr?'Добавить смену':'Отправить заявку'}</button></div></form></div></div>`}
function login(){el.innerHTML=`<div class="login-wrap"><div class="login"><div class="brand" style="padding:0"><div class="brand-logo">Т</div>Такт</div><h1>Добро пожаловать</h1><p>Выберите кабинет, чтобы посмотреть интерфейс системы управления сменами.</p><button class="primary" data-action="login-manager">Войти как руководитель</button><button class="secondary" data-action="login-employee">Войти как сотрудник</button><p class="tiny" style="margin-top:22px">Демонстрация интерфейса · Без реальной авторизации</p></div></div>`}
function renderPage(){let c=document.getElementById('content');if(!c)return;c.innerHTML=({schedule,dashboard,employees,coverage:coveragePage,reports,profile,settings}[state.page]||schedule)()}
function render(){if(!state.loggedIn){login();return}el.innerHTML=`<div class="shell">${sidebar()}<div class="main">${header()}<div class="content" id="content"></div></div></div>${modal()}`;renderPage()}
function openModal(t,id){state.modal=t;state.modalError='';state.selectedShift=id??null;render()}
function selectPage(p){state.page=p;state.modal=null;state.query='';render()}
function adjustNeed(hour,delta){let k=state.demandDate+'-'+hour;state.demand[k]=Math.max(0,Math.min(30,need(state.demandDate,hour)+delta));persist();renderPage()}
el.addEventListener('click',ev=>{const b=ev.target.closest('[data-page],[data-action],[data-shift]');if(!b)return;if(b.dataset.page){selectPage(b.dataset.page);return}if(b.dataset.shift){openModal('shift-detail',b.dataset.shift);return}let action=b.dataset.action;switch(action){case 'prev-week':state.weekOffset--;renderPage();break;case 'next-week':state.weekOffset++;renderPage();break;case 'filter':state.filter=state.filter==='all'?'weekday':state.filter==='weekday'?'weekend':'all';renderPage();break;case 'new-shift':openModal('new-shift');break;case 'close':state.modal=null;render();break;case 'close-bg':if(ev.target===b){state.modal=null;render()}break;case 'notify':openModal('notify');break;case 'approve':case 'reject':{let s=shifts.find(s=>s.id===b.dataset.id);if(s){s.status=action==='approve'?'approved':'rejected';persist();toast(action==='approve'?'Заявка одобрена':'Заявка отклонена');render()}break}case 'cancel':shifts=shifts.filter(s=>s.id!==b.dataset.id);persist();toast('Заявка отозвана');render();break;case 'delete-shift':shifts=shifts.filter(s=>s.id!==b.dataset.id);state.modal=null;persist();toast('Смена удалена');render();break;case 'need-up':adjustNeed(+b.dataset.hour,1);break;case 'need-down':adjustNeed(+b.dataset.hour,-1);break;case 'emp-details':openModal('emp-detail',b.dataset.id);break;case 'clock':{const t=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});if(!state.clockIn){state.clockIn=t;state.clockOut=null;toast('Приход отмечен')}else{const a=minutes(state.clockIn),v=minutes(t);if(v-a<300){toast('Смена меньше 5 часов. Завершение пока недоступно.');break}state.clockOut=t;state.clockIn=null;toast('Уход отмечен')}persist();renderPage();break}case 'logout':state.loggedIn=false;render();break;case 'login-manager':state.role='manager';state.loggedIn=true;state.page='schedule';render();break;case 'login-employee':state.role='employee';state.loggedIn=true;state.page='schedule';render();break}
});
el.addEventListener('change',ev=>{if(ev.target.id==='roleSwitch'||ev.target.id==='roleInSettings'){state.role=ev.target.value;state.page='schedule';state.modal=null;render()}else if(ev.target.id==='demandDate'){state.demandDate=ev.target.value;renderPage()}});
el.addEventListener('input',ev=>{if(ev.target.id==='global-search'){state.query=ev.target.value; if(state.page!=='schedule')state.page='schedule';renderPage()}});
el.addEventListener('submit',ev=>{if(ev.target.id!=='shiftForm')return;ev.preventDefault();let data=new FormData(ev.target),start=data.get('start'),end=data.get('end'),date=data.get('date'),emp=state.role==='manager'?data.get('employee'):'e1';let duration=(minutes(end)-minutes(start))/60;let existing=shifts.some(s=>s.employee===emp&&s.date===date&&s.status!=='rejected'&&minutes(start)<minutes(s.end)&&minutes(end)>minutes(s.start));let error=duration<=0?'Время окончания должно быть позже начала.':duration<5?'Смена должна длиться не менее 5 часов.':existing?'У сотрудника уже есть смена или заявка на это время.':'';if(error){state.modalError=error;let m=document.querySelector('.modal');if(m){let e=m.querySelector('.error');if(e)e.textContent=error;else{e=document.createElement('div');e.className='error';e.textContent=error;m.querySelector('.modal-actions')?.before(e)}}return}shifts.push({id:'s'+(++nextId),employee:emp,date,start,end,status:state.role==='manager'?'approved':'pending'});state.modal=null;persist();toast(state.role==='manager'?'Смена добавлена':'Заявка отправлена руководителю');render()});
render();
})();
</script></body></html>
