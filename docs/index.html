const $=id=>document.getElementById(id), p=id=>PEOPLE.find(x=>x.id===id), dep=id=>DEPTS.find(x=>x.id===id)||DEPTS[0], esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const two=n=>String(n).padStart(2,'0');const minutes=t=>Number(t.slice(0,2))*60+Number(t.slice(3,5));const datePlus=(d,n)=>{const r=new Date(d+'T12:00:00Z');r.setUTCDate(r.getUTCDate()+n);return r.toISOString().slice(0,10)};const mon=d=>datePlus(d,-(new Date(d+'T12:00:00Z').getUTCDay()+6)%7);const weekDates=()=>Array.from({length:7},(_,i)=>datePlus(mon(ui.week),i));const pretty=d=>new Date(d+'T12:00:00Z').toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});const weekday=d=>new Date(d+'T12:00:00Z').toLocaleDateString('ru-RU',{weekday:'short',timeZone:'UTC'});const rangeLabel=()=>`${pretty(weekDates()[0])} — ${pretty(weekDates()[6])}`;

function shiftDuration(s){let a=minutes(s.start),b=minutes(s.end);return (b-a+1440)%1440/60}
function covers(s,date,h){if(s.status!=='approved')return false;const start=minutes(s.start),end=minutes(s.end),v=h*60;if(end>start)return s.date===date&&start<=v&&end>v;if(end<start)return (s.date===date&&v>=start)||(datePlus(s.date,1)===date&&v<end);return false}
function staffed(date,h,deptId){return db.shifts.filter(s=>s.dept===deptId&&covers(s,date,h)).length}
function defaultNeed(h,d){if(d==='night')return h>=22||h<8?2:0;return h>=8&&h<22?(dep(d).min):0}
function demand(date,h,d){const k=`${date}|${h}|${d}`;return Object.hasOwn(db.demand,k)?db.demand[k]:defaultNeed(h,d)}
function totals(date,h,d){return {n:demand(date,h,d),c:staffed(date,h,d),diff:demand(date,h,d)-staffed(date,h,d)}}
function needSum(date){let short=0;for(let h=8;h<22;h++)for(let d of DEPTS.slice(0,4)){short+=Math.max(0,totals(date,h,d.id).diff)}for(let h of [22,23,0,1,2,3,4,5,6,7])short+=Math.max(0,totals(date,h,'night').diff);return short}

function needs(){const date=ui.date,id=ui.needsDept;const hours=id==='night'?[22,23,0,1,2,3,4,5,6,7]:Array.from({length:14},(_,i)=>i+8);const d=dep(id);const cols=DEPTS.slice(0,4);const all=id==='all';return head(isManager()?'Потребность в персонале':'Свободные часы','Норматив и фактическое покрытие рассчитываются по каждому отделу и часу',`${dateField()}<button class="btn primary" data-action="new-shift">${isManager()?'Назначить смену':'Подать заявку'}</button>`)+`<section class="panel"><div class="filter-bar">${filter('needsDept')}<span class="sub">${isManager()?'Меняй число людей через +/−. Изменения сразу влияют на расчёт.':'Оранжевым показаны часы, в которые ещё нужны люди.'}</span></div>${all?`<div class="table-scroll"><table class="need-table"><thead><tr><th>Час</th>${cols.map(x=>`<th style="color:${x.accent}">${x.name}</th>`).join('')}</tr></thead><tbody>${hours.map(h=>`<tr><td><strong>${two(h)}:00</strong></td>${cols.map(x=>{const z=totals(date,h,x.id);return `<td><button class="slot ${z.diff>0?'bad':''}" data-action="focus-dept" data-dept="${x.id}"><b>${z.c}/${z.n}</b><span>${z.diff>0?'−'+z.diff:'✓'}</span></button></td>`}).join('')}</tr>`).join('')}</tbody></table></div><div class="mini">В ячейке: в графике / необходимо. Нажми на ячейку, чтобы изменить норматив выбранного отдела.</div><div class="night-panel" style="margin-top:17px"><strong>Ночная смена · 22:00–08:00</strong><p class="sub">Все четыре отдела обслуживает универсальный сотрудник. Минимальная потребность — 2 человека, рекомендуемый диапазон из файла — 2–3.</p><button class="btn" data-action="focus-dept" data-dept="night">Настроить ночную смену →</button></div>`:`<div class="split" style="margin-bottom:14px"><div><strong style="color:${d.accent}">${d.name}</strong><div class="sub">${d.desc}</div></div><span class="dept-tag" style="--accent:${d.accent}">Минимум по схеме: ${d.min}</span></div><div class="table-scroll"><table class="need-table"><thead><tr><th>Время</th><th>В графике</th><th>Необходимо</th><th>Дефицит</th></tr></thead><tbody>${hours.map(h=>{const z=totals(date,h,id);return `<tr><td><strong>${two(h)}:00–${two((h+1)%24)}:00</strong></td><td>${z.c} чел.</td><td>${isManager()?`<div class="stepper"><button data-action="need-change" data-dept="${id}" data-hour="${h}" data-delta="-1">−</button><b>${z.n}</b><button data-action="need-change" data-dept="${id}" data-hour="${h}" data-delta="1">+</button></div>`:`${z.n} чел.`}</td><td class="${z.diff>0?'short':'ok'}">${z.diff>0?'Не хватает '+z.diff:z.diff<0?'Резерв '+Math.abs(z.diff):'Норма'}</td></tr>`}).join('')}</tbody></table></div>`}</section>`}
function centre(){return head('Сервисный центр 24/7','Структура отделов и распределение людей',dateField()+`<button class="btn" data-nav="needs">Потребность по часам →</button>`)+`<section class="panel"><h3>Четыре дневных отдела</h3><p class="sub">Плановые минимумы из присланного HTML: Альфа — 5, Микс — 5, Почта — 3, Мессенджеры — 3 на каждую дневную смену. Числа в реальном плане можно менять по часам.</p>${departmentCards(ui.date,12)}</section><section class="panel"><div class="night-panel"><strong>Ночь · универсальная команда</strong><p class="sub">По схеме ночью достаточно 2–3 человек, каждый должен иметь допуск сразу к четырём направлениям. В прототипе универсальный допуск проверяется руководителем вручную перед одобрением ночной заявки.</p><div class="badge-row">${DEPTS.slice(0,4).map(x=>`<span class="dept-tag" style="--accent:${x.accent}">${x.name}</span>`).join('')}</div><div class="numbers" style="margin-top:15px"><strong>Норма: ${demand(ui.date,22,'night')}</strong> · На 22:00: ${staffed(ui.date,22,'night')} <button class="btn slim" data-action="focus-dept" data-dept="night">Настроить →</button></div></div></section><div class="grid2"><section class="panel"><h3>Контекст работы</h3><p class="sub">Почта → письма клиник и страховых → 1С. Мессенджеры → Talk-Me → 1С. Альфа → клиенты АльфаСтрахования и обязательные регламенты. Микс → остальные страховые.</p></section><section class="panel"><h3>Правила сервиса</h3><p class="sub">Сотрудники выбирают удобное время, для новых заявок — от 5 часов. Заявки не считаются в покрытии, пока их не одобрит руководитель. В ночное время нужен универсальный допуск.</p></section></div>`}
function employees(){let list=PEOPLE.filter(x=>(ui.dept==='all'||x.dept===ui.dept)&&(!ui.search||x.name.toLowerCase().includes(ui.search.toLowerCase())));return head('Сотрудники',`${PEOPLE.length} сотрудников из полученного расписания · без выдуманных фамилий`,`${isManager()?'<button class="btn primary" data-action="new-shift">+ Назначить смену</button>':''}`)+`<div class="filter-bar">${filter()}<span class="sub">OPS — обозначение рабочего места, а не уникальный ID человека</span></div><div class="emp-list">${list.map(x=>`<div class="emp"><div class="avatar">${x.name[0]}</div><div><strong>${esc(x.name)}</strong><small>${dep(x.dept).name} · ${esc(x.station)}</small></div></div>`).join('')}</div>`}
function requestRow(s,managerView){const who=p(s.employee);return `<div class="request"><div class="avatar">${esc(who?.name?.[0]||'?')}</div><div class="info"><strong>${esc(who?.name||'Сотрудник')} · ${pretty(s.date)}</strong><small>${dep(s.dept).name} · ${s.start}–${s.end} · ${shiftDuration(s)} ч</small></div><span class="status ${s.status==='pending'?'wait':s.status==='rejected'?'no':''}">${s.status==='pending'?'Ожидает':s.status==='approved'?'Одобрена':'Отклонена'}</span>${s.status==='pending'?`<div class="tools">${managerView?`<button class="btn slim" data-action="reject" data-id="${s.id}">Отклонить</button><button class="btn slim primary" data-action="approve" data-id="${s.id}">Одобрить</button>`:`<button class="btn slim" data-action="cancel" data-id="${s.id}">Отозвать</button>`}</div>`:''}</div>`}
function requests(){const own=db.shifts.filter(s=>s.employee===ui.selectedEmployee).slice().sort((a,b)=>b.date.localeCompare(a.date));const pending=db.shifts.filter(s=>s.status==='pending');return isManager()?head('Заявки на смены','Рассмотрите заявки, чтобы обновить график и закрыть дефицит',`<button class="btn primary" data-action="new-shift">+ Назначить смену</button>`)+`<section class="panel"><h3>На рассмотрении · ${pending.length}</h3>${pending.map(s=>requestRow(s,true)).join('')||'<div class="empty">Новых заявок нет</div>'}</section><section class="panel"><h3>Недавно подтверждённые смены</h3>${db.shifts.filter(s=>s.status==='approved').slice(-8).reverse().map(s=>requestRow(s,false)).join('')}</section>`:head('Мои заявки','Выбирайте отдел, дату и удобное время от 5 часов',`<button class="btn primary" data-action="new-shift">+ Запросить смену</button>`)+`<section class="panel"><h3>Заявки: ${esc(current().name)}</h3>${own.map(s=>requestRow(s,false)).join('')||'<div class="empty">Вы ещё не подали заявку</div>'}</section><div class="notice">Смотрите общий график во вкладке «Расписание», а свободные часы по отделам — во вкладке «Свободные часы».</div>`}
function profile(){return head('Личный кабинет','Просмотр роли и персональных смен')+`<section class="panel"><div class="split"><div style="display:flex;align-items:center;gap:15px"><div class="avatar" style="width:64px;height:64px;font-size:24px">${isManager()?'Р':esc(current().name[0])}</div><div><h3 style="margin:0 0 6px">${isManager()?'Руководитель смены':esc(current().name)}</h3><span class="sub">${isManager()?'Управление отделами и нормативами':dep(current().dept).name+' · '+esc(current().station)}</span></div></div><span class="status">● Демонстрационный аккаунт</span></div></section><section class="panel"><h3>${isManager()?'Возможности руководителя':'Мои возможности'}</h3><p class="sub">${isManager()?'Настраивать потребность по каждому часу, смотреть график всех сотрудников, назначать смены и одобрять заявки.':'Просматривать общее расписание, выбирать отдел и время, отправлять и отзывать заявки. Подтверждённые смены видны всем сотрудникам.'}</p><button class="btn primary" data-nav="${isManager()?'needs':'requests'}">Перейти →</button></section>`}
function shiftModal(){const me=!isManager(),defaultDept=me?current().dept:(ui.needsDept!=='all'?ui.needsDept:'alpha');const d=dep(defaultDept),draft=ui.draft||{};return `<div class="modal-back" data-action="back"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">${me?'Запросить смену':'Назначить смену'}</h2><p>Укажите дату, отдел и время. Новая смена должна длиться не менее 5 часов. Руководитель подтверждает заявки сотрудников.</p><form id="form"><div class="formgrid">${!me?`<label class="field full">Сотрудник<select name="employee">${PEOPLE.map(x=>`<option value="${x.id}" ${draft.employee===x.id?'selected':''}>${esc(x.name)} · ${dep(x.dept).name}</option>`).join('')}</select></label>`:''}<label class="field">Дата<input name="date" type="date" value="${draft.date||ui.date}" required></label><label class="field">Отдел<select name="dept" id="formDept">${DEPTS.map(x=>`<option value="${x.id}" ${x.id===(draft.dept||defaultDept)?'selected':''}>${x.name}</option>`).join('')}</select></label><label class="field">Начало<input name="start" type="time" value="${draft.start||(defaultDept==='night'?'22:00':'09:00')}" step="3600" required></label><label class="field">Конец<input name="end" type="time" value="${draft.end||(defaultDept==='night'?'06:00':'15:00')}" step="3600" required></label></div>${ui.error?`<div class="error">${esc(ui.error)}</div>`:''}<div class="modal-actions"><button type="button" class="btn" data-action="close">Отмена</button><button type="submit" class="btn primary">${me?'Отправить заявку':'Назначить'}</button></div></form></div></div>`}
function details(){const s=db.shifts.find(x=>x.id===ui.detail);if(!s)return '';return `<div class="modal-back" data-action="back"><div class="modal"><h2>Смена · ${esc(p(s.employee)?.name)}</h2><p>${pretty(s.date)} · ${s.start}–${s.end} · ${shiftDuration(s)} часов</p><p>Отдел: ${dep(s.dept).name}<br>Статус: ${s.status==='approved'?'Подтверждена':s.status==='pending'?'Ожидает':'Отклонена'}</p><div class="modal-actions"><button class="btn primary" data-action="close">Закрыть</button></div></div></div>`}
function render(){if(!identity){$('root').innerHTML=welcome();return}const pages={overview,schedule,employees,needs,centre,requests,profile,access:accessPage};$('root').innerHTML=`<div class="app">${sidebar()}<div class="main">${header()}<div class="content">${pages[ui.page]() }<div class="site-footer">Такт · интерактивный прототип. Изменения хранятся только на этом устройстве, не синхронизируются с реальными сотрудниками.</div></div></div></div>${ui.modal?shiftModal():''}${ui.detail?details():''}`}
function toast(message){const old=document.querySelector('.toast');if(old)old.remove();let x=document.createElement('div');x.className='toast';x.textContent=message;document.body.append(x);setTimeout(()=>x.remove(),2700)}
function overlapping(a,b){const segments=s=>{const k=Date.parse(s.date+'T00:00:00Z')/60000,start=minutes(s.start),end=minutes(s.end);return [k+start,k+end+(end<start?1440:0)]};const x=segments(a),y=segments(b);return x[0]<y[1]&&y[0]<x[1]}
function isValidShift(s){if(!s.date||!/^\d{4}-\d\d-\d\d$/.test(s.date))return 'Укажите дату';if(!s.start||!s.end||s.start===s.end)return 'Время окончания должно отличаться от начала';if(s.start.slice(3)!=='00'||s.end.slice(3)!=='00')return 'Используйте целые часы';if(shiftDuration(s)<5)return 'Для новых смен нужно минимум 5 часов';if(s.dept==='night'){if(minutes(s.start)<20*60||minutes(s.end)>10*60)return 'Ночная смена должна начинаться после 20:00 и завершаться до 10:00'}else{if(minutes(s.end)<=minutes(s.start))return 'Дневная смена не должна переходить через полночь';if(minutes(s.start)<8*60||minutes(s.end)>22*60)return 'Дневные отделы работают с 08:00 до 22:00'}if(db.shifts.some(x=>x.status!=='rejected'&&x.employee===s.employee&&overlapping(s,x)))return 'У сотрудника уже есть пересекающаяся смена или заявка';return ''}
$('root').addEventListener('click',e=>{const b=e.target.closest('[data-nav],[data-action]');if(!b)return;if(b.dataset.nav){ui.page=b.dataset.nav;ui.modal=false;ui.detail=null;render();return}const a=b.dataset.action;switch(a){case 'logout':identity=null;sessionStorage.removeItem(DEMO_SESSION);ui.error='';ui.page='overview';render();break;case 'new-shift':ui.modal=true;ui.detail=null;ui.error='';ui.draft=null;render();break;case 'close':ui.modal=false;ui.detail=null;ui.error='';render();break;case 'back':if(e.target===b){ui.modal=false;ui.detail=null;render()}break;case 'detail':ui.detail=b.dataset.id;render();break;case 'week-back':ui.week=datePlus(ui.week,-7);ui.date=ui.week;render();break;case 'week-next':ui.week=datePlus(ui.week,7);ui.date=ui.week;render();break;case 'snapshot':ui.week=SNAP_DATE;ui.date=SNAP_DATE;render();break;case 'focus-dept':ui.needsDept=b.dataset.dept;ui.page='needs';render();break;case 'need-change':if(!isManager())return;{const h=+b.dataset.hour,d=b.dataset.dept,k=`${ui.date}|${h}|${d}`;db.demand[k]=Math.max(0,Math.min(50,demand(ui.date,h,d)+Number(b.dataset.delta)));save();render()}break;case 'approve':case 'reject':if(!isManager())return;{const s=db.shifts.find(x=>x.id===b.dataset.id&&x.status==='pending');if(!s)return;if(a==='approve'&&s.dept==='night'&&!confirm('Ночная смена требует универсального допуска по четырём отделам. Вы проверили допуск?'))return;s.status=a==='approve'?'approved':'rejected';save();render();toast(a==='approve'?'Заявка одобрена — покрытие пересчитано':'Заявка отклонена')}break;case 'cancel':{const s=db.shifts.find(x=>x.id===b.dataset.id);if(s?.employee!==ui.selectedEmployee||s.status!=='pending')return;db.shifts=db.shifts.filter(x=>x.id!==s.id);save();render();toast('Заявка отозвана')}break;case 'reset':if(confirm('Сбросить все локальные заявки и изменения потребности?')){db={shifts:SEED,demand:{},nextId:100};save();ui.date=SNAP_DATE;ui.week=SNAP_DATE;render();toast('Демонстрация сброшена')}break;}});
$('root').addEventListener('change',e=>{const el=e.target;switch(el.id){case 'role':ui.role=el.value;ui.page='schedule';ui.search='';render();break;case 'account':ui.selectedEmployee=el.value;render();break;case 'dept':ui.dept=el.value;render();break;case 'needsDept':ui.needsDept=el.value;render();break;case 'date':ui.date=el.value;ui.week=el.value;render();break;case 'formDept':{const f=$('form');if(f&&el.value==='night'){f.elements.start.value='22:00';f.elements.end.value='06:00'}else if(f){f.elements.start.value='09:00';f.elements.end.value='15:00'}}break;}});
$('root').addEventListener('input',e=>{if(e.target.id==='search'){ui.search=e.target.value;ui.page=ui.page==='employees'?'employees':'schedule';render();const field=$('search');field?.focus();field?.setSelectionRange(field.value.length,field.value.length)}});
$('root').addEventListener('submit',async e=>{if(e.target.id==='loginForm'){e.preventDefault();const f=new FormData(e.target);const a=await demoLogin(String(f.get('username')).trim().toLowerCase(),String(f.get('password')));if(!a){ui.error='Неверный логин или пароль';render();return}ui.error='';enterDemo(a);return}if(e.target.id==='accountForm'){e.preventDefault();if(!isManager())return;const f=new FormData(e.target),username=String(f.get('username')).trim().toLowerCase(),password=String(f.get('password')),person=PEOPLE.find(p=>p.id===f.get('employee')),ac=demoRead();if(!person||! /^[a-z0-9._-]{3,32}$/.test(username)||password.length<10||['manager','nargiz'].includes(username)||ac[username]){ui.accountError='Проверь логин, пароль и отсутствие дублей';render();return}const salt=crypto.randomUUID();ac[username]={name:person.name,employee:person.id,salt,passwordHash:await demoDigest(salt+':'+password)};demoWrite(ac);ui.accountError='';render();toast('Демо-аккаунт создан. Передайте сотруднику выданные логин и пароль');return}if(e.target.id!=='form')return;e.preventDefault();const f=new FormData(e.target);const s={id:'s'+(++db.nextId),employee:isManager()?f.get('employee'):ui.selectedEmployee,dept:f.get('dept'),date:f.get('date'),start:f.get('start'),end:f.get('end'),status:isManager()?'approved':'pending'};const error=isValidShift(s);if(error){ui.error=error;ui.draft={employee:s.employee,dept:s.dept,date:s.date,start:s.start,end:s.end};render();return}db.shifts.push(s);save();ui.modal=false;ui.error='';ui.draft=null;ui.date=s.date;ui.week=s.date;ui.page=isManager()?'schedule':'requests';render();toast(isManager()?'Смена добавлена в расписание':'Заявка отправлена на одобрение')});
render();
})();
</script>
</body></html>
