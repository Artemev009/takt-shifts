name: Deploy standalone Takt web app

on:
  push:
    branches: [deploy/rehash-original-password-20261027]
  workflow_dispatch:
    inputs:
      bootstrap_manager:
        description: 'Create initial manager account only on first deployment'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: standalone-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
      TAKT_MANAGER_USERNAME: ${{ secrets.TAKT_MANAGER_USERNAME }}
      TAKT_MANAGER_PASSWORD: ${{ secrets.TAKT_MANAGER_PASSWORD }}
      TAKT_MANAGER_NAME: ${{ secrets.TAKT_MANAGER_NAME }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify app before production
        run: |
          bash scripts/build.sh
          node tests/workflow.mjs
          node tests/deployment.mjs
      - name: Validate explicit Cloudflare account and D1 binding
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node scripts/prepare-wrangler.mjs
      - name: Apply D1 migrations to selected remote database
        run: npx --yes wrangler@4 d1 migrations apply DB --remote
      - name: One-time manager bootstrap
        if: inputs.bootstrap_manager
        run: |
          node scripts/bootstrap-manager.mjs
          trap 'rm -f .wrangler/bootstrap-manager.sql' EXIT
          npx --yes wrangler@4 d1 execute DB --remote --file=.wrangler/bootstrap-manager.sql
      - name: Rehash initial manager password without changing its text
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$TAKT_MANAGER_USERNAME"
          test -n "$TAKT_MANAGER_PASSWORD"
          mkdir -p .wrangler
          chmod 700 .wrangler
          trap 'rm -f .wrangler/current-manager.json .wrangler/rehash-manager.sql .wrangler/rehash-result.json' EXIT
          npx --yes wrangler@4 d1 execute DB --remote --json --command="SELECT username,salt,password_hash,must_change_password FROM password_accounts WHERE user_id='takt-primary-manager'" > .wrangler/current-manager.json
          chmod 600 .wrangler/current-manager.json
          node scripts/rehash-manager.mjs
          npx --yes wrangler@4 d1 execute DB --remote --json --file=.wrangler/rehash-manager.sql > .wrangler/rehash-result.json
          npx --yes wrangler@4 d1 execute DB --remote --json --command="SELECT username,salt,password_hash,must_change_password FROM password_accounts WHERE user_id='takt-primary-manager'" > .wrangler/current-manager.json
          TAKT_VERIFY_MANAGER_ONLY=1 node scripts/rehash-manager.mjs
      - name: Publish independent HTTPS web app
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .wrangler
          for attempt in 1 2 3; do
            echo "Cloudflare deployment attempt ${attempt}/3"
            if npx --yes wrangler@4 deploy 2>&1 | tee .wrangler/deploy-output.log; then
              echo "Worker successfully deployed."
              exit 0
            fi
            if [[ ${attempt} -eq 3 ]] || ! grep -Fq 'binding DB of type d1 failed to generate' .wrangler/deploy-output.log; then
              echo "::error::Wrangler failed to deploy the Worker. Inspect the error above."
              exit 1
            fi
            echo "::warning::Cloudflare D1 binding generation failed. Retrying deployment."
            sleep $((attempt * 15))
          done
      - name: Verify production website and show real address
        run: node scripts/verify-public.mjs
      - name: Verify old manager login still works
        run: |
          node --input-type=module <<'JS'
          const base='https://takt-shifts-live.perospilsa.workers.dev';
          const res=await fetch(base+'/api/auth/login',{
            method:'POST',headers:{'content-type':'application/json',origin:base},
            body:JSON.stringify({username:process.env.TAKT_MANAGER_USERNAME,password:process.env.TAKT_MANAGER_PASSWORD}),
            signal:AbortSignal.timeout(20000)
          });
          const data=await res.json();
          if(res.status!==200||data.ok!==true)throw Error('Original manager login still failing (HTTP '+res.status+')');
          console.log('Verified: original manager username and password work on public HTTPS.');
          JS
