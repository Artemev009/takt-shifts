name: Deploy standalone Takt web app

on:
  workflow_dispatch:
    inputs:
      bootstrap_manager:
        description: 'Create initial manager account only on first deployment'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: standalone-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
      TAKT_MANAGER_USERNAME: ${{ secrets.TAKT_MANAGER_USERNAME }}
      TAKT_MANAGER_PASSWORD: ${{ secrets.TAKT_MANAGER_PASSWORD }}
      TAKT_MANAGER_NAME: ${{ secrets.TAKT_MANAGER_NAME }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify app before production
        run: |
          bash scripts/build.sh
          node tests/workflow.mjs
          node tests/deployment.mjs
      - name: Validate explicit Cloudflare account and D1 binding
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node scripts/prepare-wrangler.mjs
      - name: Apply D1 migrations to selected remote database
        run: npx --yes wrangler@4 d1 migrations apply DB --remote
      - name: One-time manager bootstrap
        if: inputs.bootstrap_manager
        run: |
          node scripts/bootstrap-manager.mjs
          trap 'rm -f .wrangler/bootstrap-manager.sql' EXIT
          npx --yes wrangler@4 d1 execute DB --remote --file=.wrangler/bootstrap-manager.sql
      - name: Publish independent HTTPS web app
        run: npx --yes wrangler@4 deploy
