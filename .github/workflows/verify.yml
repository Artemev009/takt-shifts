name: Verify app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build worker
        run: bash scripts/build.sh
      - name: Check shift workflow
        run: node tests/workflow.mjs
      - name: Check standalone deployment safety
        run: node tests/deployment.mjs
      - name: Validate public deployment smoke script syntax
        run: node --check scripts/verify-public.mjs
