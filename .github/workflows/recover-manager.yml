name: Recover initial Takt manager access

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-worker-production
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
      TAKT_MANAGER_USERNAME: ${{ secrets.TAKT_MANAGER_USERNAME }}
      TAKT_MANAGER_PASSWORD: ${{ secrets.TAKT_MANAGER_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare selected D1 binding
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node scripts/prepare-wrangler.mjs
      - name: Set one-time temporary password
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/recover-manager.mjs
          trap 'rm -f .wrangler/recover-manager.sql' EXIT
          npx --yes wrangler@4 d1 execute DB --remote --file=.wrangler/recover-manager.sql 2>&1 | tee .wrangler/recover-result.log
          grep -Fq 'reset-complete' .wrangler/recover-result.log
          echo 'Initial manager temporary password recovered; change it at first login.'
